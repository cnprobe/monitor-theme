# 只使用 Komari 时不需要 Token。可以复制 .env.example 为 .env，
# 用来设置 DOCKER_UID/DOCKER_GID、BRIDGE_PORT 等 Compose 变量。
# bridge/config.json 仍通过只读 bind mount 单独挂载。
services:
  chicken-bridge:
    build: .
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BRIDGE_PORT:-3777}:${BRIDGE_PORT:-3777}"
    environment:
      HOST: "0.0.0.0"
      PORT: "${BRIDGE_PORT:-3777}"
      CONFIG_PATH: /app/bridge/config.json
      # Komari-only 不需要以下 Token；保留映射是为了兼容其他适配器。
      SERVER_STATUS_TOKEN: "${SERVER_STATUS_TOKEN:-}"
      NEZHA_TOKEN: "${NEZHA_TOKEN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"
    volumes:
      - type: bind
        source: ./bridge/config.json
        target: /app/bridge/config.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
