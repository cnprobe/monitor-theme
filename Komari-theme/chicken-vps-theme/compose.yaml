# 精简 Bridge 只负责多人游戏，不需要 Komari Token 或监控源配置。
# .env 仅用于 UID/GID、端口和可信代理开关。
# bridge/config.json 仍通过只读 bind mount 单独挂载。
services:
  chicken-bridge:
    build: .
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BRIDGE_PORT:-3777}:${BRIDGE_PORT:-3777}"
    environment:
      HOST: "0.0.0.0"
      PORT: "${BRIDGE_PORT:-3777}"
      CONFIG_PATH: /app/bridge/config.json
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - type: bind
        source: ./bridge/config.json
        target: /app/bridge/config.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
