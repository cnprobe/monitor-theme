<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- Komari replaces the exact title and description markers below. -->
<title>Komari Monitor</title>
<meta name="description" content="A simple server monitor tool." />
<!-- viewport-fit=cover：让 CSS 的 env(safe-area-inset-*) 在刘海屏/挖孔屏生效 -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fd08a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
<link rel="stylesheet" href="/style.css">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js" } }</script>
<link rel="modulepreload" href="/vendor/three.module.js">
</head>
<body>
<div id="app"></div>
<div id="boot">🐔 鸡场加载中…</div>

<div id="hud">
  <div id="topbar">
    <div class="topbar-brand">🐔 <span id="site-name">Komari 养鸡场</span></div>
    <div class="topbar-counts">
      <span>节点 <b id="online">0</b></span>
      <span>网站 <b id="web-online">0</b></span>
      <span>访客 <b id="visitors">1</b></span>
    </div>
    <button id="bridge-state" type="button" class="connecting" title="伴生服务状态">连接中</button>
  </div>
  <div id="board">
    <h3 id="board-title">🐔 啄倒榜</h3>
    <div id="board-rows"></div>
  </div>
  <div id="feed"></div>
  <div id="probe-warn"></div>
  <div id="ko-banner"></div>
  <div id="me">
    <div id="me-line">
      <span id="me-name">小鸡</span>
      <button id="me-edit" type="button" title="改名字">✏️</button>
    </div>
    <div id="me-name-editor" class="hidden">
      <div id="me-name-row">
        <input id="me-name-input" maxlength="12" placeholder="名字（最多 12 字）">
        <button id="me-name-ok" type="button">确定</button>
      </div>
    </div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="score">等待伴生服务同步…</div>
  </div>
  <div id="hint-desktop" class="hint">Esc 释放鼠标 · WASD 移动 · Shift 疾跑 · 空格 跳 · 左键 啄 · 右键 扇翅 · 滚轮 缩放 · M 静音</div>
  <div id="hint-touch" class="hint">左摇杆移动 · 拖屏幕转视角 · 轻点啄 · 右侧按钮扇翅/跳</div>
</div>

<div id="touch-ui"></div>
<footer id="powered-by">Powered by Komari Monitor.</footer>

<script type="module" src="/js/main.js"></script>
</body>
</html>
