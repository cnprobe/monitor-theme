name: Build Chicken VPS Bridge

on:
  push:
    tags:
      - 'chicken-vps-bridge-v*'
  pull_request:
    paths:
      - 'Komari-theme/chicken-vps-theme/**'
      - '.github/workflows/build-theme-image.yml'
      - '.github/workflows/chicken-vps-bridge.yml'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-theme-image.yml
    with:
      context: ./Komari-theme/chicken-vps-theme
      image_name: chicken-vps-bridge
      cache_scope: chicken-vps-bridge
      publish: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
