name: Build Chicken VPS Bridge

on:
  push:
    branches:
      - main
    paths:
      - 'Komari-theme/chicken-vps-theme/**'
      - '.github/workflows/build-theme-image.yml'
      - '.github/workflows/chicken-vps-bridge.yml'
  pull_request:
    paths:
      - 'Komari-theme/chicken-vps-theme/**'
      - '.github/workflows/build-theme-image.yml'
      - '.github/workflows/chicken-vps-bridge.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional tag, for example 0.1.1'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-theme-image.yml
    with:
      context: ./Komari-theme/chicken-vps-theme
      image_name: chicken-vps-bridge
      cache_scope: chicken-vps-bridge
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
